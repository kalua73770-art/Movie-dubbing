[project]
name = "hindi-movie-dubbing"
version = "1.0.0"
description = "Cloud-first Hindi movie/anime dubbing pipeline using Gemini and FFmpeg"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "google-genai>=2.25.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hindi_dubbing*"]
