name: Movie Dubbing Test

on:
  push:
    paths:
      - "test/input.mp4"
  workflow_dispatch:
    inputs:
      video_path:
        description: "Path of the uploaded test video in the repository"
        required: true
        default: "test/input.mp4"
        type: string

jobs:
  dub:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read

    env:
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GEMINI_TRANSCRIBE_MODEL: gemini-3.5-transcribe
      GEMINI_TEXT_MODELS: gemini-3.5-flash-lite,gemini-2.5-flash-lite
      GEMINI_TTS_MODELS: gemini-2.5-flash-preview-tts,gemini-3.1-flash-tts-preview
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check test video
        run: |
          set -e
          VIDEO_PATH="${{ inputs.video_path || 'test/input.mp4' }}"
          echo "Using video: $VIDEO_PATH"
          test -f "$VIDEO_PATH" || {
            echo "::error::Video not found at $VIDEO_PATH"
            echo "Upload your test video to the repository first, then run this workflow."
            exit 1
          }
          echo "Input video:"
          ls -lh "$VIDEO_PATH"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run movie dubbing
        run: |
          mkdir -p test-output
          VIDEO_PATH="${{ inputs.video_path || 'test/input.mp4' }}"
          python -m hindi_dubbing.cli.main "$VIDEO_PATH" "test-output/dubbed_hindi.mp4"

      - name: Show output
        if: always()
        run: |
          echo "=== Output files ==="
          find test-output -maxdepth 3 -type f -printf '%p %k KB\n' 2>/dev/null || true
          echo "=== Job directories ==="
          find /tmp/movie-dubbing -maxdepth 3 -type f -printf '%p %k KB\n' 2>/dev/null | tail -100 || true

      - name: Upload dubbed video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dubbed-video
          path: test-output/*.mp4
          if-no-files-found: error
          retention-days: 3

      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dubbing-logs
          path: |
            test-output/**/*.log
            /tmp/movie-dubbing/**/*.log
            /tmp/movie-dubbing/**/*.json
          if-no-files-found: warn
          retention-days: 7
