# Manual Antigravity continuity verification trigger
name: Movie Dubbing Test

concurrency:
  group: movie-dubbing-test
  cancel-in-progress: true

on:
  push:
    paths:
      - "test/Input.mp4"
      - "hindi_dubbing/**"
      - "pyproject.toml"
      - ".github/workflows/test-dubbing.yml"
  workflow_dispatch:
    inputs:
      video_path:
        description: "Path of the uploaded test video in the repository"
        required: true
        default: "test/Input.mp4"
        type: string

jobs:
  dub:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
      actions: write

    env:
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ANTIGRAVITY_API_KEYS: ${{ secrets.ANTIGRAVITY_API_KEYS || secrets.GEMINI_API_KEYS }}
      GEMINI_TRANSCRIBE_MODEL: gemini-3.5-transcribe
      GEMINI_TEXT_MODELS: gemini-3.5-flash-lite,gemini-3.1-flash-lite
      GEMINI_TTS_MODELS: gemini-3.8-flash-tts,gemini-3.8-flash-lite-tts,gemini-3.1-flash-tts-preview,gemini-2.5-flash-preview-tts
      GEMINI_VIDEO_MODELS: gemini-3.6-flash,gemini-3.5-flash-lite
      AUDIO_STEM_PROVIDER: reconstruct
      GEMINI_HTTP_TIMEOUT_MS: "600000"
      GEMINI_TEXT_TIMEOUT_MS: "45000"
      GEMINI_TRANSCRIBE_TIMEOUT_MS: "600000"
      GEMINI_TTS_TIMEOUT_MS: "50000"
      GEMINI_VIDEO_TIMEOUT_MS: "90000"
      TRANSCRIBE_CHUNK_SECONDS: "900"
      TRANSCRIBE_OVERLAP_SECONDS: "8"
      TRANSCRIBE_WORKERS: "4"
      TRANSLATION_WORKERS: "4"
      TTS_WORKERS: "4"
      GROQ_TRANSLATION_MODEL: "openai/gpt-oss-120b"
      GROQ_TIMEOUT_MS: "60000"
      TTS_MODE: "single"
      TTS_MIN_COVERAGE_RATIO: "0.75"
      TTS_REWRITE_ATTEMPTS: "3"
      TTS_BATCH_CHARS: "6000"
      TTS_LANE_COOLDOWN_SECONDS: "20"
      ENABLE_ANTIGRAVITY: "true"
      ANTIGRAVITY_AGENT: "antigravity-preview-09-2026"
      ANTIGRAVITY_TIMEOUT_MS: "90000"
      ANTIGRAVITY_WINDOW_SECONDS: "240"
      ANTIGRAVITY_MAX_WINDOWS: "8"
      ANTIGRAVITY_MAX_KEYS: "2"
      ANTIGRAVITY_MAX_TOTAL_TOKENS: "20000"
      TTS_BATCH_MAX_SEGMENTS: "12"
      TRANSLATION_BATCH_CHARS: "6000"
      VIDEO_ANALYSIS_MAX_WINDOWS: "6"
      VIDEO_ANALYSIS_WINDOW_SECONDS: "180"
      VIDEO_MAX_KEYS_PER_MODEL: "2"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check test video
        run: |
          set -e
          VIDEO_PATH="${{ inputs.video_path || 'test/Input.mp4' }}"
          echo "Using video: $VIDEO_PATH"
          test -f "$VIDEO_PATH" || {
            echo "::error::Video not found at $VIDEO_PATH"
            echo "Upload your test video to the repository first, then run this workflow."
            exit 1
          }
          echo "Input video:"
          ls -lh "$VIDEO_PATH"

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3.1
        with:
          ffmpeg-version: release
          linking-type: static

      - name: Verify FFmpeg
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Preflight Python imports
        run: |
          python -m compileall -q hindi_dubbing
          python -c "from google import genai; from google.genai import types; print('google-genai import OK'); print(types.HttpOptions(timeout=120000))"
          python -c "from hindi_dubbing.settings import settings; from hindi_dubbing.gemini import GeminiService; from hindi_dubbing.antigravity import AntigravityService; from hindi_dubbing.video_analysis import VideoAnalyzer; from hindi_dubbing.movie_brain import MovieBrain; from hindi_dubbing.background_reconstruction import reconstruct_background; from hindi_dubbing.pipeline.orchestrator import run_pipeline; print('pipeline imports OK')"

      - name: Smoke test Groq translation
        run: python scripts/groq_translation_smoke.py

      - name: Run movie dubbing
        run: |
          mkdir -p test-output
          VIDEO_PATH="${{ inputs.video_path || 'test/Input.mp4' }}"
          python -m hindi_dubbing.cli.main "$VIDEO_PATH" "test-output/dubbed_hindi_latest.mp4"

      - name: Show output
        if: always()
        run: |
          echo "=== Output files ==="
          find test-output -maxdepth 3 -type f -printf '%p %k KB\n' 2>/dev/null || true
          echo "=== Job directories ==="
          find /tmp/movie-dubbing -maxdepth 3 -type f -printf '%p %k KB\n' 2>/dev/null | tail -100 || true

      - name: Upload latest dubbed video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dubbed-video-latest
          path: test-output/dubbed_hindi_latest.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Remove older dubbed-video artifacts
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          sleep 2
          artifacts="$(
            gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.artifacts[]
                | select(.name == "dubbed-video" or .name == "dubbed-video-latest")
                | [.created_at, .id]
                | @tsv' \
              | sort -r
          )"

          keep_id="$(printf '%s\n' "$artifacts" | head -n 1 | cut -f2)"
          echo "Keeping newest dubbed artifact ID: $keep_id"

          printf '%s\n' "$artifacts" | tail -n +2 | cut -f2 | while read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            echo "Deleting old artifact: $artifact_id"
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done

      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dubbing-logs
          path: |
            test-output/**/*.log
            /tmp/movie-dubbing/**/*.log
            /tmp/movie-dubbing/**/*.json
          if-no-files-found: warn
          retention-days: 7
