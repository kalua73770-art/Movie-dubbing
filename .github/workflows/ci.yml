name: Movie Dubbing CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Compile Python
        run: python -m compileall -q app.py hindi_dubbing tests

      - name: Offline resilience tests
        run: python -m unittest discover -s tests -v

      - name: Live Gemini smoke test
        if: ${{ env.GEMINI_API_KEYS != '' }}
        run: python scripts/gemini_live_smoke.py

      - name: Live test skipped notice
        if: ${{ env.GEMINI_API_KEYS == '' }}
        run: echo "GEMINI_API_KEYS repository secret is not configured; offline tests were run."
