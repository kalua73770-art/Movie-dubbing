# Default configuration for Hindi Dubbing Pipeline

project:
  name: "hindi_dubbing"
  version: "0.1.0"
  chunk_duration_seconds: 600  # 10 minutes per chunk
  chunk_overlap_seconds: 30    # Overlap to preserve speaker context

audio:
  sample_rate: 16000
  channels: 1
  format: "wav"
  extraction_codec: "pcm_s16le"

diarization:
  model: "pyannote/speaker-diarization-3.1"
  min_speakers: 1
  max_speakers: 20
  min_duration: 0.5  # Minimum segment duration in seconds

transcription:
  model: "large-v3"  # Whisper model size
  language: "en"     # Source language
  task: "transcribe"
  beam_size: 5
  temperature: 0.0
  condition_on_previous_text: true
  compression_ratio_threshold: 2.4
  logprob_threshold: -1.0
  no_speech_threshold: 0.6

translation:
  model: "facebook/nllb-200-distilled-600M"  # Or use local LLM
  source_lang: "eng_Latn"
  target_lang: "hin_Deva"
  max_length: 512
  temperature: 0.3
  top_p: 0.9
  # Duration matching
  max_duration_ratio: 1.15  # Hindi can be up to 15% longer
  min_duration_ratio: 0.85  # Hindi can be up to 15% shorter
  rewrite_attempts: 3

voice:
  # Main character voices (high frequency speakers)
  main_character_threshold: 0.05  # 5% of total speech time
  max_main_characters: 20
  
  # Voice models (XTTS v2, Bark, etc.)
  tts_model: "coqui/XTTS-v2"
  tts_language: "hi"
  speaker_wav_duration: 6  # Seconds of reference audio needed
  
  # Generic voice pool for minor characters
  generic_voices:
    male:
      - "generic_male_1"
      - "generic_male_2"
      - "generic_male_3"
    female:
      - "generic_female_1"
      - "generic_female_2"
      - "generic_female_3"
  
  # Voice variation for generic pool
  pitch_variance: 0.1
  speed_variance: 0.1

mixing:
  # BGM/SFX preservation
  separate_sources: true
  separation_model: "htdemucs"  # Demucs model for source separation
  dialogue_stem: "vocals"
  background_stems: ["drums", "bass", "other"]
  
  # Mixing levels (dB)
  dialogue_level: 0.0
  bgm_level: -6.0
  sfx_level: -3.0
  ambience_level: -9.0
  
  # Audio processing
  normalize: true
  target_lufs: -16.0
  apply_compression: true
  compression_ratio: 3.0
  compression_threshold: -18.0

qc:
  # Quality control thresholds
  max_duration_mismatch: 1.0  # seconds
  min_confidence: 0.7
  max_overlap: 0.1  # seconds
  min_gap: 0.05  # seconds
  flag_silence_threshold: 0.5  # seconds of unexpected silence

render:
  video_codec: "libx264"
  audio_codec: "aac"
  audio_bitrate: "192k"
  preset: "medium"
  crf: 20

paths:
  cache_dir: ".cache"
  models_dir: "models"
  temp_dir: "temp"
  output_dir: "output"

logging:
  level: "INFO"
  format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"