services:
  - type: web
    name: movie-dubbing
    env: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_TRANSCRIBE_MODEL
        value: gemini-3.5-transcribe
      - key: GEMINI_TEXT_MODELS
        value: gemini-3.5-flash-lite,gemini-2.5-flash-lite
      - key: GEMINI_TTS_MODELS
        value: gemini-2.5-flash-preview-tts,gemini-3.1-flash-tts-preview
