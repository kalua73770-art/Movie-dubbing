services:
  - type: web
    name: movie-dubbing
    env: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_TRANSCRIBE_MODEL
        value: gemini-3.5-transcribe
      - key: GEMINI_TEXT_MODELS
        value: gemini-3.5-flash-lite,gemini-3.1-flash-lite
      - key: GEMINI_TTS_MODELS
        value: gemini-3.8-flash-tts,gemini-3.8-flash-lite-tts
      - key: GEMINI_VIDEO_MODELS
        value: gemini-3.8-flash,gemini-3.5-flash-lite
      - key: TRANSCRIBE_CHUNK_SECONDS
        value: "900"
      - key: TRANSCRIBE_OVERLAP_SECONDS
        value: "8"
      - key: TRANSCRIBE_WORKERS
        value: "2"
      - key: VIDEO_ANALYSIS_MAX_WINDOWS
        value: "6"
      - key: VIDEO_MAX_KEYS_PER_MODEL
        value: "1"
